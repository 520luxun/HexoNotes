<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">LC 谐振时感抗与容抗相等</title>
  <desc id="desc">感抗随频率升高而增大，容抗随频率升高而减小。在固有频率处，两者大小相等、虚部符号相反，因此串联回路的总电抗为零。</desc>
  <rect width="1000" height="600" fill="#ffffff"/>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #182033; letter-spacing: 0; }
    .axis { stroke: #3f4a5d; stroke-width: 1.6; }
    .grid { stroke: #dce1e9; stroke-width: 1; }
    .minor { stroke: #edf0f4; stroke-width: 1; }
    .guide { stroke: #687386; stroke-width: 1.4; stroke-dasharray: 7 6; }
    .tick { font-size: 13px; fill: #525d70; }
    .small { font-size: 13px; fill: #525d70; }
    .state { font-size: 15px; font-weight: 700; }
    .detail { font-size: 13px; }
  </style>

  <text x="500" y="30" text-anchor="middle" font-size="21" font-weight="700">为什么 LC 会发生谐振：感抗与容抗在 f₀ 处相等</text>
  <text x="500" y="53" text-anchor="middle" class="small">双对数坐标；X₀ = ω₀L = 1/(ω₀C)，曲线表示电抗大小</text>

  <!-- Plot grid -->
  <line class="grid" x1="100" y1="80" x2="900" y2="80"/>
  <line class="minor" x1="100" y1="128.2" x2="900" y2="128.2"/>
  <line class="minor" x1="100" y1="191.8" x2="900" y2="191.8"/>
  <line class="grid" x1="100" y1="240" x2="900" y2="240"/>
  <line class="minor" x1="100" y1="288.2" x2="900" y2="288.2"/>
  <line class="minor" x1="100" y1="351.8" x2="900" y2="351.8"/>
  <line class="grid" x1="100" y1="400" x2="900" y2="400"/>

  <line class="grid" x1="100" y1="80" x2="100" y2="400"/>
  <line class="minor" x1="220.4" y1="80" x2="220.4" y2="400"/>
  <line class="minor" x1="379.6" y1="80" x2="379.6" y2="400"/>
  <line class="guide" x1="500" y1="80" x2="500" y2="400"/>
  <line class="minor" x1="620.4" y1="80" x2="620.4" y2="400"/>
  <line class="minor" x1="779.6" y1="80" x2="779.6" y2="400"/>
  <line class="grid" x1="900" y1="80" x2="900" y2="400"/>

  <!-- Reactance curves -->
  <polyline points="100,400 220.4,351.8 379.6,288.2 500,240 620.4,191.8 779.6,128.2 900,80"
            fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="100,80 220.4,128.2 379.6,191.8 500,240 620.4,288.2 779.6,351.8 900,400"
            fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="500" cy="240" r="8" fill="#ffffff" stroke="#0f8a65" stroke-width="4"/>
  <path d="M508 232 L557 181" fill="none" stroke="#0f8a65" stroke-width="1.6"/>
  <text x="563" y="173" font-size="14" font-weight="700" fill="#0f8a65">X<tspan baseline-shift="sub" font-size="11">L</tspan> = X<tspan baseline-shift="sub" font-size="11">C</tspan></text>
  <text x="563" y="194" class="small">大小相等，符号相反</text>

  <text x="684" y="111" font-size="15" font-weight="700" fill="#dc2626">X<tspan baseline-shift="sub" font-size="12">L</tspan> = ωL</text>
  <text x="684" y="132" class="small">随频率升高而增大</text>
  <text x="675" y="365" font-size="15" font-weight="700" fill="#2563eb">X<tspan baseline-shift="sub" font-size="12">C</tspan> = 1/(ωC)</text>
  <text x="675" y="386" class="small">随频率升高而减小</text>

  <!-- Axes -->
  <line class="axis" x1="100" y1="400" x2="900" y2="400"/>
  <line class="axis" x1="100" y1="80" x2="100" y2="400"/>
  <g class="tick" text-anchor="middle">
    <text x="100" y="421">0.1</text><text x="220.4" y="421">0.2</text><text x="379.6" y="421">0.5</text>
    <text x="500" y="421" font-weight="700">1</text><text x="620.4" y="421">2</text><text x="779.6" y="421">5</text><text x="900" y="421">10</text>
  </g>
  <g class="tick" text-anchor="end">
    <text x="91" y="85">10</text><text x="91" y="133">5</text><text x="91" y="197">2</text><text x="91" y="245">1</text>
    <text x="91" y="293">0.5</text><text x="91" y="357">0.2</text><text x="91" y="405">0.1</text>
  </g>
  <text x="500" y="446" text-anchor="middle" font-size="15">归一化频率 f/f₀</text>
  <text x="26" y="240" text-anchor="middle" font-size="15" transform="rotate(-90 26 240)">相对电抗大小 X/X₀</text>
  <text x="509" y="99" class="small" font-weight="700">f = f₀</text>

  <!-- Three operating regions -->
  <line x1="355" y1="470" x2="355" y2="566" stroke="#dce1e9"/>
  <line x1="645" y1="470" x2="645" y2="566" stroke="#dce1e9"/>
  <text x="225" y="490" text-anchor="middle" class="state">f &lt; f₀：容性区域</text>
  <text x="225" y="517" text-anchor="middle" class="detail">X<tspan baseline-shift="sub" font-size="11">C</tspan> &gt; X<tspan baseline-shift="sub" font-size="11">L</tspan></text>
  <text x="225" y="542" text-anchor="middle" class="detail">X = X<tspan baseline-shift="sub" font-size="11">L</tspan> − X<tspan baseline-shift="sub" font-size="11">C</tspan> &lt; 0</text>
  <text x="225" y="564" text-anchor="middle" class="small">总无功性质表现为电容性</text>

  <text x="500" y="490" text-anchor="middle" class="state" fill="#0f8a65">f = f₀：谐振</text>
  <text x="500" y="517" text-anchor="middle" class="detail">X<tspan baseline-shift="sub" font-size="11">L</tspan> = X<tspan baseline-shift="sub" font-size="11">C</tspan></text>
  <text x="500" y="542" text-anchor="middle" class="detail">+jX<tspan baseline-shift="sub" font-size="11">L</tspan> 与 −jX<tspan baseline-shift="sub" font-size="11">C</tspan> 相消</text>
  <text x="500" y="564" text-anchor="middle" class="small">串联回路的总电抗为 0</text>

  <text x="775" y="490" text-anchor="middle" class="state">f &gt; f₀：感性区域</text>
  <text x="775" y="517" text-anchor="middle" class="detail">X<tspan baseline-shift="sub" font-size="11">L</tspan> &gt; X<tspan baseline-shift="sub" font-size="11">C</tspan></text>
  <text x="775" y="542" text-anchor="middle" class="detail">X = X<tspan baseline-shift="sub" font-size="11">L</tspan> − X<tspan baseline-shift="sub" font-size="11">C</tspan> &gt; 0</text>
  <text x="775" y="564" text-anchor="middle" class="small">总无功性质表现为电感性</text>
</svg>
