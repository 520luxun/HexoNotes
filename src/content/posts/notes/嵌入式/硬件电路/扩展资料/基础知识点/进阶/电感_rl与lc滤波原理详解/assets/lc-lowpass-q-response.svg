  <line class="minor" x1="100" y1="105" x2="900" y2="105"/>
  <line class="grid" x1="100" y1="150" x2="900" y2="150"/>
  <line class="guide" x1="100" y1="172.5" x2="900" y2="172.5"/>
  <line class="grid" x1="100" y1="240" x2="900" y2="240"/>
  <line class="grid" x1="100" y1="330" x2="900" y2="330"/>
  <line class="grid" x1="100" y1="420" x2="900" y2="420"/>
  <line class="grid" x1="100" y1="510" x2="900" y2="510"/>

