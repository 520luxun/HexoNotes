<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">不同 Q 值下二阶 LC 低通的归一化幅频响应</title>
  <desc id="desc">横轴是频率与固有频率之比，纵轴是相对直流增益的幅度。Q 等于 0.5、0.707、1 和 2 的四条曲线展示阻尼、谐振峰与负三分贝截止频率的关系。</desc>
  <rect width="1000" height="620" fill="#ffffff"/>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; letter-spacing: 0; }
    .grid { stroke: #d9dee8; stroke-width: 1; }
    .minor { stroke: #edf0f5; stroke-width: 1; }
    .axis { stroke: #354052; stroke-width: 1.6; }
    .guide { stroke: #687386; stroke-width: 1.3; stroke-dasharray: 7 6; }
    .tick { font-size: 13px; fill: #4b5565; }
    .note { font-size: 13px; fill: #4b5565; }
    .legend { font-size: 14px; font-weight: 600; }
    .curve { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <text x="500" y="31" text-anchor="middle" font-size="21" font-weight="700">不同 Q 值下二阶 LC 低通的幅频响应</text>
  <text x="500" y="52" text-anchor="middle" class="note">归一化模型：|H| = 1 / sqrt[(1-r^2)^2 + (r/Q)^2]，r = f/f₀</text>

  <defs>
    <clipPath id="plot-clip"><rect x="100" y="60" width="800" height="480"/></clipPath>
  </defs>

