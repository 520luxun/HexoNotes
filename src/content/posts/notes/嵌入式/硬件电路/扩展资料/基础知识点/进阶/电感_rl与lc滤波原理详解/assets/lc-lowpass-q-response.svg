  <line class="axis" x1="100" y1="540" x2="900" y2="540"/>
  <line class="axis" x1="100" y1="60" x2="100" y2="540"/>

  <g class="tick" text-anchor="end">
    <text x="91" y="65">+12</text><text x="91" y="110">+6</text><text x="91" y="155">0</text>
    <text x="91" y="177">−3</text><text x="91" y="245">−12</text><text x="91" y="335">−24</text>
    <text x="91" y="425">−36</text><text x="91" y="515">−48</text>
  </g>
  <g class="tick" text-anchor="middle">
    <text x="100" y="562">0.1</text><text x="220.4" y="562">0.2</text><text x="379.6" y="562">0.5</text>
    <text x="500" y="562" font-weight="700">1</text><text x="620.4" y="562">2</text><text x="779.6" y="562">5</text><text x="900" y="562">10</text>
  </g>
  <text x="500" y="594" text-anchor="middle" font-size="15">归一化频率 r = f/f₀（对数坐标）</text>
  <text x="25" y="300" text-anchor="middle" font-size="15" transform="rotate(-90 25 300)">幅度 / dB（相对直流增益）</text>

  <rect x="688" y="72" width="195" height="116" rx="4" fill="#ffffff" fill-opacity="0.93" stroke="#c8cfda"/>
  <g class="legend">
    <line x1="706" y1="95" x2="746" y2="95" stroke="#2563eb" stroke-width="3"/><text x="758" y="100">Q = 0.5</text>
    <line x1="706" y1="120" x2="746" y2="120" stroke="#0f9d75" stroke-width="3"/><text x="758" y="125">Q = 0.707</text>
    <line x1="706" y1="145" x2="746" y2="145" stroke="#f59e0b" stroke-width="3"/><text x="758" y="150">Q = 1</text>
    <line x1="706" y1="170" x2="746" y2="170" stroke="#dc2626" stroke-width="3"/><text x="758" y="175">Q = 2</text>
  </g>

  <circle cx="500" cy="172.5" r="5" fill="#0f9d75" stroke="#ffffff" stroke-width="2"/>
  <path d="M494 182 L448 213" fill="none" stroke="#0f9d75" stroke-width="1.3"/>
  <text x="444" y="220" text-anchor="end" class="note" font-weight="600">Q = 1/√2 时，f₀ = f꜀</text>
  <text x="507" y="82" class="note">f = f₀</text>
  <text x="108" y="167" class="note">−3 dB</text>
</svg>
