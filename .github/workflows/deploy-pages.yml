name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` also runs scripts/sync-notes.mjs; on CI the Obsidian
      # vault is absent, so the script keeps the notes committed in the repo.
      - name: Build site
        id: build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
        continue-on-error: true
        env:
          # ~1k note images are optimised at build time; keep sharp's worker
          # pool small so the runner does not get killed for memory.
          NODE_OPTIONS: --max-old-space-size=4096
          VIPS_CONCURRENCY: 2

      # CI logs need a login to read; surface the tail of the error as a commit
      # status so it can be inspected without one.
      - name: Report build failure
        if: steps.build.outcome == 'failure'
        run: |
          msg=$(tail -n 40 build.log | tr '\n' ' ' | cut -c1-130)
          echo "::error::$msg"
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg d "$msg" '{state:"error",description:$d,context:"build-log"}')" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      # GitHub Pages would otherwise skip Astro's _astro/ assets via Jekyll.
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
